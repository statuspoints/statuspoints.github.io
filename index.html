<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Points &amp; Status Tracker</title>
<meta name="description" content="Personal airline and hotel loyalty tracker: balances, elite status, and voucher expirations. Works offline.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Points">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --text: #17202B;
    --accent: #1B3A5C;
    --muted: #5D6876;
    --faint: #8A929D;
    --line: #E9E7E0;
    --inset: #F5F4EF;
    --track: #E2E0D8;
    --field: #FFFFFF;
    --field-line: #D8D5CC;
    --dots: rgba(27, 58, 92, .32);
    --hover: rgba(27, 58, 92, .06);
    --accent-soft: rgba(27, 58, 92, .12);
    --on-accent: #FFFFFF;
    --warn: #B45309;
    --danger: #B42318;
    --danger-soft: rgba(180, 35, 24, .09);
    --shadow: 0 1px 2px rgba(23, 32, 43, .05);
    --toast-bg: #17202B;
    --toast-fg: #F3F5F9;
    --toast-accent: #9DC0EC;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1420;
      --card: #16202F;
      --text: #E8ECF4;
      --accent: #7FA6D9;
      --muted: #97A3B5;
      --faint: #66748A;
      --line: #233044;
      --inset: #111A28;
      --track: #26354D;
      --field: #111A28;
      --field-line: #2D3C54;
      --dots: rgba(127, 166, 217, .4);
      --hover: rgba(127, 166, 217, .1);
      --accent-soft: rgba(127, 166, 217, .18);
      --on-accent: #0E1420;
      --warn: #F0A254;
      --danger: #F28B7F;
      --danger-soft: rgba(242, 139, 127, .13);
      --shadow: none;
      --toast-bg: #E8ECF4;
      --toast-fg: #0E1420;
      --toast-accent: #1B3A5C;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding:
      calc(20px + env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      calc(40px + env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  button { touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* Header */
  .top { display: flex; align-items: center; gap: 12px; margin: 4px 4px 0; }
  .mark { width: 38px; height: 38px; flex: none; }
  .mark .m-bg, .mark .m-star { fill: var(--accent); }
  .mark .m-disc { fill: var(--card); }
  .mark .m-ring { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  /* Sections */
  .sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 4px 8px; }
  .sec { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sec-meta { font-size: 12.5px; color: var(--muted); text-align: right; }
  .sec-meta .warn { color: var(--warn); font-weight: 600; }
  .sec-meta .danger { color: var(--danger); font-weight: 600; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* Program rows */
  .programs { list-style: none; margin: 0; padding: 0; }
  .row { padding: 14px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-main { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
  .who { min-width: 0; }
  .name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em; }
  .status { margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .status .tier { color: var(--accent); font-weight: 600; }
  .status + .status { margin-top: 3px; }
  .status span { white-space: nowrap; } /* wrap only between " · " parts */
  .bal { flex: none; text-align: right; }
  .unit { margin-top: 1px; font-size: 12px; color: var(--muted); }

  /* Tap-to-edit numbers */
  .num {
    position: relative;
    min-width: 44px;
    margin: -3px -8px;
    padding: 3px 8px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 19px;
    font-weight: 650;
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-align: right;
    text-decoration: underline dotted var(--dots);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 5px;
    cursor: pointer;
  }
  .num::after { content: ""; position: absolute; inset: -8px -4px; } /* larger touch target */
  .num:active { background: var(--hover); }
  .num:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .num.is-empty { color: var(--faint); font-weight: 500; }
  .num.sm { font-size: 16px; }
  @media (hover: hover) {
    .num:hover { background: var(--hover); text-decoration-color: var(--accent); }
  }
  .num-input {
    width: 8em;
    margin: -4px -9px;
    padding: 3px 8px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--field);
    color: var(--text);
    font: inherit;
    font-size: 19px;
    font-weight: 650;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .num-input.sm { width: 6.5em; font-size: 16px; }

  /* Delta Medallion panel */
  .delta { margin-top: 12px; padding: 12px 14px 10px; border-radius: 10px; background: var(--inset); }
  .mqd-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 10px; }
  .mqd-count { display: flex; align-items: baseline; gap: 8px; }
  .mqd-label { font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .of { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .next { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .fill { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .45s cubic-bezier(.2, .7, .2, 1); }
  .notch { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--inset); }
  .ticks { position: relative; height: 16px; margin-top: 5px; font-size: 11px; line-height: 16px; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; color: var(--muted); }
  .tick.end { transform: translateX(-100%); }
  .tick.hit { color: var(--accent); font-weight: 650; }

  /* Footnote */
  .footnote { display: flex; gap: 8px; margin: 10px 6px 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .footnote svg { flex: none; width: 14px; height: 14px; margin-top: 2px; color: var(--accent); }
  .footnote strong { color: var(--text); font-weight: 600; }

  /* Vouchers */
  .vlist { list-style: none; margin: 0; padding: 0; }
  .voucher { display: flex; align-items: flex-start; gap: 8px; padding: 12px 8px 12px 16px; }
  .voucher + .voucher { border-top: 1px solid var(--line); }
  .voucher.new { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .v-body { flex: 1; min-width: 0; }
  .v-name { font-weight: 600; overflow-wrap: anywhere; }
  .v-note { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .v-exp { margin-top: 3px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .voucher.soon .v-exp { color: var(--warn); }
  .voucher.soon .v-exp strong { font-weight: 650; }
  .voucher.expired .v-name { color: var(--muted); }
  .badge {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    vertical-align: 1px;
  }
  .v-del {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    margin-top: -6px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .v-del svg { width: 14px; height: 14px; }
  .v-del:active { background: var(--hover); color: var(--text); }
  .v-del:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) {
    .v-del:hover { background: var(--hover); color: var(--text); }
  }
  .empty { margin: 0; padding: 22px 16px; text-align: center; font-size: 14px; color: var(--muted); outline: none; }

  .vform {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "name name" "note note" "exp add";
    gap: 12px;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--line);
  }
  @media (min-width: 540px) {
    .vform { grid-template-columns: 1fr 11rem auto; grid-template-areas: "name name name" "note exp add"; }
  }
  .f-name { grid-area: name; }
  .f-note { grid-area: note; }
  .f-exp { grid-area: exp; min-width: 0; }
  .field label { display: block; margin: 0 0 5px 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input {
    display: block;
    width: 100%;
    min-width: 0;
    height: 44px;
    margin: 0;
    padding: 0 12px;
    border: 1px solid var(--field-line);
    border-radius: 10px;
    background: var(--field);
    color: var(--text);
    font: inherit;
    font-size: 16px; /* 16px+ keeps iOS from zooming on focus */
    -webkit-appearance: none;
    appearance: none;
  }
  .field input::placeholder { color: var(--faint); }
  .field input::-webkit-date-and-time-value { text-align: left; }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .add {
    grid-area: add;
    align-self: end;
    height: 44px;
    padding: 0 22px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
  }
  .add:active { filter: brightness(1.12); }
  .add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot { margin: 28px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* Undo toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: calc(100% - 32px);
    padding: 8px 8px 8px 16px;
    border-radius: 12px;
    background: var(--toast-bg);
    color: var(--toast-fg);
    font-size: 14px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .2);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 16px);
    transition: opacity .18s, transform .18s, visibility 0s .18s;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .18s, transform .18s; }
  .toast-msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button {
    flex: none;
    padding: 6px 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--toast-accent);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect class="m-bg" width="64" height="64" rx="15"/>
      <circle class="m-disc" cx="32" cy="32" r="19.84"/>
      <circle class="m-ring" cx="32" cy="32" r="16.13"/>
      <path class="m-star" d="M32 22.85L34.23 29.7H41.44L35.6 33.94L37.83 40.79L32 36.56L26.17 40.79L28.4 33.94L22.57 29.7H29.77Z"/>
    </svg>
    <div>
      <h1>Points &amp; Status Tracker</h1>
      <p class="sub" id="today"></p>
    </div>
  </header>

  <section aria-labelledby="h-programs">
    <div class="sec-row">
      <h2 class="sec" id="h-programs">Programs</h2>
      <span class="sec-meta">Tap any number to edit</span>
    </div>
    <ul class="card programs" id="programs"></ul>
    <p class="footnote">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M6 4h6v6"/></svg>
      <span><strong>$75k spend</strong> on the Sapphire Reserve this year would add IHG Diamond, Hyatt Explorist, and Southwest A-List.</span>
    </p>
  </section>

  <section aria-labelledby="h-vouchers">
    <div class="sec-row">
      <h2 class="sec" id="h-vouchers">Vouchers</h2>
      <span class="sec-meta" id="v-meta"></span>
    </div>
    <div class="card">
      <ul class="vlist" id="vlist"></ul>
      <p class="empty" id="vempty" tabindex="-1">No vouchers yet — add your first one below.</p>
      <form class="vform" id="vform" autocomplete="off">
        <div class="field f-name">
          <label for="vname">Voucher</label>
          <input id="vname" name="name" required maxlength="80" placeholder="e.g. Delta companion certificate">
        </div>
        <div class="field f-note">
          <label for="vnote">Value / note</label>
          <input id="vnote" name="note" maxlength="120" placeholder="e.g. $250 eCredit or 1 free night">
        </div>
        <div class="field f-exp">
          <label for="vexp">Expires</label>
          <input id="vexp" name="exp" type="date" required>
        </div>
        <button class="add" type="submit">Add</button>
      </form>
    </div>
  </section>

  <p class="foot" id="foot">Saved on this device only</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-msg" id="toast-msg"></span>
  <button type="button" id="toast-undo">Undo</button>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'status-tracker-v2';
  const SAVE_DELAY = 400;
  const SOON_DAYS = 60;
  const MAX_VALUE = 999999999999;
  const MQD_GOAL = 28000;
  const TIERS = [
    { name: 'Silver', min: 5000 },
    { name: 'Gold', min: 10000 },
    { name: 'Platinum', min: 15000 },
    { name: 'Diamond', min: 28000 },
  ];

  // status: one line per source card — tiers are highlighted, sources muted, joined with " · "
  const PROGRAMS = [
    { id: 'delta', name: 'Delta SkyMiles', unit: 'miles', medallion: true },
    { id: 'koreanair', name: 'Korean Air SkyPass', unit: 'miles' },
    { id: 'hilton', name: 'Hilton Honors', unit: 'points', status: [
      { tiers: ['Gold'], via: ['Amex Platinum'] },
    ] },
    { id: 'marriott', name: 'Marriott Bonvoy', unit: 'points', status: [
      { tiers: ['Gold Elite'], via: ['Amex Platinum'] },
    ] },
    { id: 'ihg', name: 'IHG One Rewards', unit: 'points', status: [
      { tiers: ['Platinum Elite'], via: ['Sapphire Reserve', 'thru\u00a012/31/27'] },
    ] },
    { id: 'hyatt', name: 'World of Hyatt', unit: 'points' },
    { id: 'amex', name: 'Amex Membership Rewards', unit: 'points' },
    { id: 'chase', name: 'Chase Ultimate Rewards', unit: 'points' },
    { id: 'lhw', name: 'Leading Hotels of the World', status: [
      { tiers: ['Leaders Club Sterling'], via: ['Amex Platinum'] },
    ] },
    { id: 'cars', name: 'Avis / Hertz / National', status: [
      { tiers: ['Preferred Plus', "President's Circle", 'Emerald Exec'], via: ['Amex Platinum'] },
      { tiers: ['Preferred Plus', 'Emerald Exec'], via: ['Sapphire Reserve'] },
    ] },
    { id: 'lounges', name: 'Airport lounges', status: [
      { tiers: ['Sapphire Lounges', 'Priority Pass', 'Air Canada Maple Leaf'], via: ['Sapphire Reserve'] },
      { tiers: ['Centurion', 'Sky Club (10 visits/yr)', 'Escape', 'Plaza Premium', 'Priority Pass'], via: ['Amex Platinum'] },
    ] },
  ];

  const $ = (sel) => document.querySelector(sel);
  const numFmt = new Intl.NumberFormat('en-US');
  const fmt = (n) => numFmt.format(n);
  const dateFmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const todayFmt = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  function svgIcon(markup) {
    const t = document.createElement('template');
    t.innerHTML = markup;
    return t.content.firstChild;
  }
  const X_ICON = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg>';

  /* ---------- State & persistence ---------- */

  const isCount = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0;

  function load() {
    const s = { balances: {}, mqd: 0, vouchers: [] };
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (raw && typeof raw === 'object') {
        if (raw.balances && typeof raw.balances === 'object') {
          for (const [id, v] of Object.entries(raw.balances)) if (isCount(v)) s.balances[id] = Math.floor(v);
        }
        if (isCount(raw.mqd)) s.mqd = Math.floor(raw.mqd);
        if (Array.isArray(raw.vouchers)) {
          s.vouchers = raw.vouchers
            .filter((v) => v && typeof v.name === 'string')
            .map((v) => ({
              name: v.name,
              note: typeof v.note === 'string' ? v.note : '',
              exp: typeof v.exp === 'string' ? v.exp : '',
            }));
        }
      }
    } catch (e) { /* corrupt or unavailable storage: start fresh */ }
    return s;
  }

  const state = load();
  let saveTimer = 0;

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, SAVE_DELAY);
  }

  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      showToast('Couldn’t save — browser storage is unavailable');
    }
  }

  // Flush a pending save if the app is backgrounded or closed inside the debounce window.
  addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (saveTimer) saveNow();
    } else {
      renderToday();
      renderVouchers(); // days-left may have rolled over while backgrounded
    }
  });

  /* ---------- Editable numbers ---------- */

  function getField(field) {
    if (field === 'mqd') return state.mqd;
    const id = field.slice(4); // "bal:<id>"
    return Object.prototype.hasOwnProperty.call(state.balances, id) ? state.balances[id] : null;
  }

  function setField(field, value) {
    if (field === 'mqd') {
      state.mqd = value ?? 0;
    } else {
      const id = field.slice(4);
      if (value == null) delete state.balances[id];
      else state.balances[id] = value;
    }
    scheduleSave();
  }

  // Empty input clears the value; input with no digits at all (e.g. "abc") is ignored.
  function parseEntry(raw) {
    if (raw.trim() === '') return { value: null };
    const digits = raw.replace(/\D/g, '');
    if (!digits) return null;
    return { value: Math.min(Number(digits), MAX_VALUE) };
  }

  function paintNum(btn) {
    const v = getField(btn.dataset.field);
    const empty = v == null;
    btn.textContent = empty ? '—' : fmt(v);
    btn.classList.toggle('is-empty', empty);
    btn.setAttribute('aria-label', `${btn.dataset.label}: ${empty ? 'not set' : fmt(v)}. Edit`);
  }

  function numButton(field, label, extraClass) {
    const btn = h('button', {
      type: 'button',
      class: extraClass ? `num ${extraClass}` : 'num',
      'data-field': field,
      'data-label': label,
    });
    paintNum(btn);
    return btn;
  }

  function startEdit(btn) {
    const field = btn.dataset.field;
    const before = getField(field);
    const input = h('input', {
      type: 'text',
      inputmode: 'numeric',
      pattern: '[0-9]*',
      enterkeyhint: 'done',
      autocomplete: 'off',
      spellcheck: 'false',
      maxlength: '20',
      class: btn.classList.contains('sm') ? 'num-input sm' : 'num-input',
      'aria-label': btn.dataset.label,
    });
    input.value = before == null ? '' : String(before);
    btn.replaceWith(input);
    input.focus();
    input.setSelectionRange(0, input.value.length);

    let done = false;
    const finish = (commit, refocus) => {
      if (done) return;
      done = true;
      if (commit) {
        const parsed = parseEntry(input.value);
        if (parsed && parsed.value !== before) setField(field, parsed.value);
      }
      paintNum(btn);
      input.replaceWith(btn);
      if (field === 'mqd') updateMedallion();
      if (refocus) btn.focus();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true, true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false, true); }
    });
    input.addEventListener('blur', () => finish(true, false));
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button.num');
    if (btn) startEdit(btn);
  });

  // iOS Safari doesn't blur an input when tapping plain page content; do it so edits commit.
  document.addEventListener('pointerdown', (e) => {
    const active = document.activeElement;
    if (active && active.classList.contains('num-input') && e.target !== active) active.blur();
  });

  /* ---------- Programs ---------- */

  function statusLine({ tiers, via }) {
    const parts = [
      ...tiers.map((t) => h('span', { class: 'tier' }, t)),
      ...via.map((v) => h('span', null, v)),
    ];
    return h('div', { class: 'status' }, parts.flatMap((p, i) => (i ? [' · ', p] : [p])));
  }

  function medallionPanel() {
    const bar = h('div', {
      class: 'bar',
      id: 'mqd-bar',
      role: 'progressbar',
      'aria-label': 'MQDs toward Diamond Medallion',
      'aria-valuemin': '0',
      'aria-valuemax': String(MQD_GOAL),
    }, h('div', { class: 'fill', id: 'mqd-fill' }));
    const ticks = h('div', { class: 'ticks', 'aria-hidden': 'true' });
    for (const t of TIERS) {
      const pct = (t.min / MQD_GOAL) * 100;
      if (t.min < MQD_GOAL) bar.append(h('span', { class: 'notch', style: `left:${pct}%` }));
      ticks.append(h('span', {
        class: t.min >= MQD_GOAL ? 'tick end' : 'tick',
        style: `left:${pct}%`,
        'data-min': String(t.min),
        title: `${t.name}: ${fmt(t.min)} MQDs`,
      }, t.name));
    }
    return h('div', { class: 'delta' },
      h('div', { class: 'mqd-head' },
        h('div', { class: 'mqd-count' },
          h('span', { class: 'mqd-label' }, 'MQDs'),
          numButton('mqd', 'Delta MQDs', 'sm'),
          h('span', { class: 'of' }, `/ ${fmt(MQD_GOAL)}`)),
        h('div', { class: 'next', id: 'mqd-next' })),
      bar,
      ticks);
  }

  function renderPrograms() {
    const rows = PROGRAMS.map((p) => {
      const who = h('div', { class: 'who' }, h('div', { class: 'name' }, p.name));
      if (p.medallion) who.append(h('div', { class: 'status', id: 'medallion-status' }));
      else if (p.status) who.append(...p.status.map(statusLine));

      const main = h('div', { class: 'row-main' }, who);
      if (p.unit) {
        main.append(h('div', { class: 'bal' },
          numButton(`bal:${p.id}`, `${p.name} balance`),
          h('div', { class: 'unit' }, p.unit)));
      }
      return h('li', { class: 'row' }, main, p.medallion ? medallionPanel() : null);
    });
    $('#programs').replaceChildren(...rows);
    updateMedallion();
  }

  function medallionFor(mqd) {
    let current = null;
    for (const t of TIERS) {
      if (mqd >= t.min) current = t;
      else return { current, next: t };
    }
    return { current, next: null };
  }

  function updateMedallion() {
    const mqd = state.mqd;
    const { current, next } = medallionFor(mqd);

    $('#medallion-status').replaceChildren(
      current ? h('span', { class: 'tier' }, `${current.name} Medallion`) : 'No Medallion status');
    $('#mqd-next').textContent = next
      ? `${fmt(next.min - mqd)} MQDs to ${next.name}`
      : 'Diamond reached — top tier';

    $('#mqd-fill').style.width = `${Math.min(mqd / MQD_GOAL, 1) * 100}%`;
    const bar = $('#mqd-bar');
    bar.setAttribute('aria-valuenow', String(Math.min(mqd, MQD_GOAL)));
    bar.setAttribute('aria-valuetext', `${fmt(mqd)} of ${fmt(MQD_GOAL)} MQDs`);
    for (const tick of document.querySelectorAll('.tick')) {
      tick.classList.toggle('hit', mqd >= Number(tick.dataset.min));
    }
  }

  /* ---------- Vouchers ---------- */

  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function daysUntil(date) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((date - today) / 864e5); // round absorbs DST 23/25h days
  }

  // Soonest expiration first; YYYY-MM-DD strings sort chronologically.
  function sortVouchers() {
    state.vouchers.sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999'));
  }

  function expiryLine(v) {
    const date = parseISODate(v.exp);
    if (!date) return { cls: '', line: h('div', { class: 'v-exp' }, 'no expiration date') };
    const days = daysUntil(date);
    const when = dateFmt.format(date);
    if (days < 0) {
      return { cls: 'expired', line: h('div', { class: 'v-exp' }, h('span', { class: 'badge' }, 'EXPIRED'), when) };
    }
    if (days === 0) {
      return { cls: 'soon', line: h('div', { class: 'v-exp' }, h('strong', null, 'expires today')) };
    }
    if (days <= SOON_DAYS) {
      return {
        cls: 'soon',
        line: h('div', { class: 'v-exp' }, `expires ${when} · `, h('strong', null, `${days} day${days === 1 ? '' : 's'} left`)),
      };
    }
    return { cls: '', line: h('div', { class: 'v-exp' }, `expires ${when}`) };
  }

  function renderVouchers(highlight) {
    let soon = 0;
    let expired = 0;
    const items = state.vouchers.map((v, i) => {
      const { cls, line } = expiryLine(v);
      if (cls === 'soon') soon++;
      if (cls === 'expired') expired++;
      return h('li', { class: ['voucher', cls, v === highlight && 'new'].filter(Boolean).join(' ') },
        h('div', { class: 'v-body' },
          h('div', { class: 'v-name' }, v.name),
          v.note ? h('div', { class: 'v-note' }, v.note) : null,
          line),
        h('button', { type: 'button', class: 'v-del', 'data-index': String(i), 'aria-label': `Delete ${v.name}`, title: 'Delete' },
          svgIcon(X_ICON)));
    });
    $('#vlist').replaceChildren(...items);
    $('#vlist').hidden = items.length === 0;
    $('#vempty').hidden = items.length > 0;

    const meta = [];
    if (soon) meta.push(h('span', { class: 'warn' }, `${soon} expiring soon`));
    if (expired) meta.push(h('span', { class: 'danger' }, `${expired} expired`));
    $('#v-meta').replaceChildren(...meta.flatMap((m, i) => (i ? [' · ', m] : [m])));
  }

  $('#vform').addEventListener('submit', (e) => {
    e.preventDefault();
    const nameEl = $('#vname');
    const expEl = $('#vexp');
    const name = nameEl.value.trim();
    if (!name) { nameEl.value = ''; nameEl.focus(); return; }
    if (!parseISODate(expEl.value)) { expEl.focus(); return; }

    const voucher = { name, note: $('#vnote').value.trim(), exp: expEl.value };
    state.vouchers.push(voucher);
    sortVouchers();
    scheduleSave();
    renderVouchers(voucher);
    e.target.reset();
    // Keep the keyboard flow on desktop; don't pop the on-screen keyboard back up on phones.
    if (matchMedia('(pointer: fine)').matches) nameEl.focus();
    else document.activeElement.blur();
  });

  $('#vlist').addEventListener('click', (e) => {
    const btn = e.target.closest('.v-del');
    if (!btn) return;
    const index = Number(btn.dataset.index);
    const [removed] = state.vouchers.splice(index, 1);
    if (!removed) return;
    scheduleSave();
    renderVouchers();

    const remaining = document.querySelectorAll('.v-del');
    (remaining[Math.min(index, remaining.length - 1)] || $('#vempty')).focus();

    showToast(`Deleted “${removed.name}”`, () => {
      state.vouchers.splice(Math.min(index, state.vouchers.length), 0, removed);
      sortVouchers();
      scheduleSave();
      renderVouchers(removed);
    });
  });

  /* ---------- Toast ---------- */

  let toastTimer = 0;
  let undoAction = null;

  function showToast(message, onUndo) {
    $('#toast-msg').textContent = message;
    undoAction = onUndo || null;
    $('#toast-undo').hidden = !onUndo;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    $('#toast').classList.remove('show');
    undoAction = null;
  }

  $('#toast-undo').addEventListener('click', () => {
    const action = undoAction;
    hideToast();
    if (action) action();
  });

  /* ---------- Boot ---------- */

  function renderToday() {
    $('#today').textContent = todayFmt.format(new Date());
  }

  sortVouchers();
  renderToday();
  renderPrograms();
  renderVouchers();

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone && navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
    navigator.serviceWorker.ready.then(() => {
      $('#foot').textContent = 'Saved on this device only · available offline';
    });
  }
})();
</script>
</body>
</html>
